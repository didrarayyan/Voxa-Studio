name: Build & Publish Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (Voxa-Studio-Setup.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: voxa-studio

      - name: Run unit tests (main app)
        working-directory: voxa-studio
        run: cargo test

      - name: Build Voxa Studio release binary
        working-directory: voxa-studio
        run: cargo build --release --bin voxa-studio

      - name: Run unit tests (installer)
        working-directory: voxa-studio
        run: cargo test --bin voxa-setup --features installer

      - name: Build Voxa-Studio-Setup.exe
        working-directory: voxa-studio
        run: cargo build --release --bin voxa-setup --features installer

      - name: Package release artifacts & SHA256 checksum
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item voxa-studio\target\release\voxa-setup.exe dist\Voxa-Studio-Setup.exe -Force
          $hash = (Get-FileHash dist\Voxa-Studio-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Voxa-Studio-Setup.exe" | Out-File -Encoding ascii dist\Voxa-Studio-Setup.exe.sha256
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Voxa-Studio-Setup.exe
            dist/Voxa-Studio-Setup.exe.sha256
          generate_release_notes: true
